name: Rename production HTML to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv first-class-website-PRODUCTION-v3.9.html index.html
          git commit -m "Rename production HTML to index.html"
          git push
