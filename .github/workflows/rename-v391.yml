name: Rename v3.9.1 to index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-v391.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with v3.9.1 build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm index.html
          git mv first-class-website-PRODUCTION-v3.9.1.html index.html
          git commit -m "Rename production HTML to index.html"
          git push
